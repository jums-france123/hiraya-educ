<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <title>Hiraya Hub: Your Educational Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main id="content">

    </main>

    <script>
        // Fetch and load your separate nav.html snippet file
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Re-initialize interactive click listeners once elements land on the DOM
                initializeDropdownActions();
            })
            .catch(err => console.error('Error loading navbar:', err));

        function initializeDropdownActions() {
            document.querySelectorAll('.nav-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    // Prevent global window click from instantly shutting the menu down
                    e.stopPropagation();

                    const currentDropdown = button.nextElementSibling;

                    // Close any other open dropdowns first
                    document.querySelectorAll('.dropdown-menu').forEach(menu => {
                        if (menu !== currentDropdown) {
                            menu.classList.remove('show');
                        }
                    });

                    // Toggle clicked state for this specific element
                    currentDropdown.classList.toggle('show');
                });
            });

            // Global dismisser: closes pinned dropdowns if user clicks a blank page area
            document.addEventListener('click', () => {
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    menu.classList.remove('show');
                });
            });
        }
    </script>

    <script src="js/router.js"></script>

</body>

</html>
